http: "0.0.0.0:8899"#服务端监听

manager: ""#服务负责人的飞书用户ID，进程 panic 时会通过飞书卡片通知该用户

log_file_path: "./logs/"#日志文件目录（server_app.log / server_audit.log / server_http_api.log 都会落在这里。三服务共用同一目录时按 server_/client_/swm_ 前缀区分）

#SwM 调用本服务端的 HMAC 签名校验；enforce=true 时未签名 / 签名不通过的请求会被拒
swm_auth:
  enforce: true #生产环境建议开启
  shared_secret_env: "SWM_SHARED_KEY"#优先从环境变量读取共享密钥
  shared_secret: "shared_secret"#与 swm 端 swm_shared_secret 保持一致
  max_skew_seconds: 300 #允许的时间戳偏移（秒），防重放
  allowed_origin: ""#留空表示不校验 Origin
  #源 IP 白名单（CIDR 格式，单 IP 必须带 /32 或 /128 后缀）。
  #留空时默认仅放行 127.0.0.1/32 和 ::1/128，匹配「SwM 与 Server 同机部署」拓扑。
  #跨机部署务必显式声明，例：
  #allowed_cidrs:
  #  - "10.0.0.5/32"     # SwM 所在主机
  #  - "10.0.1.0/24"     # 同网段所有 SwM 实例
  allowed_cidrs: []

#飞书通知（审批流提醒、权限变更通知）
feishu:
  enabled: true
  app_id_env: "FEISHU_APP_ID"#优先从环境变量读取
  app_secret_env: "FEISHU_APP_SECRET"#优先从环境变量读取

database:
  prod:
    write:
      username: "user_write"
      password: "password"
      address: "ip:port"#实际数据库ip:port
      table: "table"#实际表名
    read:
      username: "user_read"
      password: "password"
      address: "ip:port"#实际数据库ip:port
      table: "table"#实际表名
  test:
    write:
      username: "user_test_write"
      password: "password"
      address: "ip:port"#实际数据库ip:port
      table: "table"#实际表名
    read:
      username: "user_test_read"
      password: "password"
      address: "ip:port"#实际数据库ip:port
      table: "table"#实际表名
